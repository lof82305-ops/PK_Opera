<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>粉墨千面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
:root{--bg:#f5eeea;--ink:#2a2420;--sub:#8a7f78;--line:#cdc3bc;--tab:#6b625c;--btn:#cfc7b3;--seal:#b8322a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1816;--ink:#efe9de;--sub:#a39b8f;--line:#3d3732;--tab:#b9aea2;--btn:#4a443b;--seal:#c0463d}}
:root[data-theme="dark"]{--bg:#1b1816;--ink:#efe9de;--sub:#a39b8f;--line:#3d3732;--tab:#b9aea2;--btn:#4a443b;--seal:#c0463d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.back{position:absolute;left:14px;top:12px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(160,152,146,.85);color:#fff;display:grid;place-items:center}
.tcol{position:absolute;left:24px;top:84px;display:flex;flex-direction:column;align-items:center;gap:14px}
.title{writing-mode:vertical-rl;font-weight:900;font-size:38px;line-height:1.15;letter-spacing:.08em}
.seal{writing-mode:vertical-rl;background:var(--seal);color:var(--bg);font-size:12px;line-height:1.1;padding:5px 4px;border-radius:2px;letter-spacing:.05em}
.toast{position:absolute;left:50%;top:25%;transform:translateX(-50%);padding:11px 22px;border-radius:99px;background:var(--tab);color:var(--bg);font-size:13px;letter-spacing:.16em;white-space:nowrap;transition:opacity .4s;pointer-events:none;z-index:3}
.tools{position:absolute;right:16px;top:84px;display:flex;flex-direction:column;gap:16px;align-items:center}
.tool{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tool .ring{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub)}
.tool em{font-style:normal;font-size:12px;letter-spacing:.2em;color:var(--sub);white-space:nowrap}
.stage{position:absolute;left:50%;top:28%;transform:translateX(-50%);width:min(84%,calc(44dvh * .894));aspect-ratio:706/790;filter:drop-shadow(0 10px 14px rgba(120,90,80,.2));isolation:isolate}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage canvas{touch-action:none}
.stage svg{pointer-events:none}
.tabs{position:absolute;left:12px;right:12px;bottom:114px;display:flex;justify-content:center;gap:8px}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--sub);font-size:13px;letter-spacing:.12em}
.pill[aria-pressed="true"]{background:var(--tab);border-color:var(--tab);color:var(--bg)}
.bottom{position:absolute;left:0;right:0;bottom:20px;height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px}
.dots{display:flex;gap:14px;align-items:center}
.dot{width:46px;height:46px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.dot.opt{width:58px;height:58px;background:rgba(150,138,128,.16);font-size:12px;letter-spacing:.04em;color:var(--ink)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--sub)}
.next{width:52px;height:52px;border-radius:50%;border:0;background:var(--btn);color:#fff;display:grid;place-items:center}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

@keyframes cfade{from{opacity:0;transform:translate(-50%,-50%) scale(1.04)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.cov-group{position:absolute;left:calc(50% - var(--sw)/2 + var(--sw)*.06);bottom:calc(env(safe-area-inset-bottom,0px) + 39px - var(--sw)*.0395);display:flex;align-items:stretch;gap:calc(var(--sw)*.02);z-index:2}
.cov-col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--sw)*.022)}
.cov-title{color:var(--cink);transform:rotate(-1.5deg)}
.cov-title b{display:flex;flex-direction:column;font-weight:400;font-family:"ZMX","STXingkai","Xingkai SC","KaiTi",serif;font-size:calc(var(--sw)*.165);line-height:.98;-webkit-text-stroke:calc(var(--sw)*.0045) var(--cink);paint-order:stroke fill}
.cov-title i{font-style:normal;display:block;clip-path:inset(0 0 100% 0);animation:cbrush 1.1s cubic-bezier(.5,.1,.3,1) forwards}
@keyframes cbrush{to{clip-path:inset(-10% -10% -10% -10%)}}
.cov-sub{display:flex;flex-direction:column;justify-content:space-between;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;font-size:calc(var(--sw)*.047);line-height:1;color:var(--csub);opacity:0;animation:cin .9s 4.8s forwards}
.cov-sub i{font-style:normal;display:block}
.cov-seal{flex:none;width:calc(var(--sw)*.076);height:calc(var(--sw)*.079);background:var(--cseal);color:var(--csealtxt);font-family:"ZMX",serif;font-size:calc(var(--sw)*.032);line-height:1.05;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;border-radius:2px;box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.28);z-index:2;opacity:0;animation:cin .8s 3.9s forwards}
.cov-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:15px;letter-spacing:.7em;padding-left:.7em;color:#3a312b;text-shadow:0 0 8px rgba(235,227,211,.95),0 0 3px rgba(235,227,211,.9);z-index:2;opacity:0;animation:cin 1s 5.8s forwards,cbreathe 3s 7s infinite}
@keyframes cin{to{opacity:1}}
@keyframes cbreathe{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.cov-stage,.cov-title i,.cov-sub,.cov-seal,.cov-hint{animation-duration:.01s;animation-delay:0s}.cov{transition-duration:.01s}}
.act{position:absolute;left:0;right:0;top:70px;bottom:108px;display:none;flex-direction:column;align-items:center;opacity:0;transition:opacity .9s}
.act.on{display:flex}.act.vis{opacity:1}
.fig{position:relative;flex:1;min-height:0;width:100%}.fig svg{position:absolute;inset:0;width:100%;height:100%}#actback,#acttop{will-change:transform}
.card{margin:0 20px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;line-height:1.7;color:var(--sub);background:rgba(255,255,255,.35)}
.card h3{margin:0 0 4px;font-size:15px;color:var(--ink);letter-spacing:.2em}.card h3 small{font-size:12px;font-weight:400;letter-spacing:.1em;margin-left:10px;color:var(--sub)}.card p{margin:0}
.qz{position:fixed;inset:0;z-index:40;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:opacity 1s ease}
.qz.out{opacity:0;pointer-events:none}
.qin{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.qb{position:absolute;left:84px;right:20px;top:84px;bottom:64px;overflow-y:auto;transition:opacity .22s;scrollbar-width:none}.qb::-webkit-scrollbar{display:none}.qb.f{opacity:0}
.qs{font-size:21px;font-weight:700;line-height:1.65;letter-spacing:.05em;margin:0 0 26px}
.qo{display:flex;flex-direction:column;gap:12px}
.qopt{text-align:left;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.3);color:var(--ink);font-size:14.5px;line-height:1.55;letter-spacing:.04em;transition:background .2s,color .2s,border-color .2s}
.qopt.sel{background:var(--tab);border-color:var(--tab);color:var(--bg)}
.qdots{position:absolute;left:84px;bottom:28px;display:flex;gap:10px}
.qdots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--sub);display:block}.qdots i.on{background:var(--sub)}
.qb.r{top:56px;bottom:84px;left:20px}.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;min-height:100%;justify-content:center}
.res svg{width:min(100%,200px);height:auto;display:block}.res img.bzav{width:min(100%,190px);height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(120,90,80,.2))}
.res h2{margin:0;font-size:30px;font-weight:900;letter-spacing:.25em;padding-left:.25em}
.res .tag{font-size:12px;letter-spacing:.2em;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.res .tl{font-size:16px;font-weight:700;letter-spacing:.12em}
.res p{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;line-height:1.75;color:var(--sub);background:rgba(255,255,255,.35);text-align:left}
.res .wip{font-size:12px;color:var(--sub);letter-spacing:.08em}
.rbtn{position:absolute;left:20px;right:20px;bottom:24px;display:flex;gap:10px;justify-content:center}
.pill.fill{background:var(--tab);border-color:var(--tab);color:var(--bg)}.rbtn .pill{padding:10px 18px;font-size:14px}
</style>

function buildBz(st){
 var d='<defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter></defs>';
 var o=img(BZ.white)+img(BZ.ink_frame);
 o+=BZ_FORE[st.f].photo?img(BZ.gold):BZ_FORE[st.f].v();
 o+=BZ_BROWS[st.b].photo?img(BZ.ink_brow):BZ_BROWS[st.b].v();
 o+=BZ_EYES[st.e].photo?img(BZ.ink_eye):BZ_EYES[st.e].v();
 o+=BZ_NOSE[st.n].photo?img(BZ.ink_nose):BZ_NOSE[st.n].v();
 o+='<g transform="translate('+DX+' '+DY+')">'+BZ_BEARD[st.d].v()+'</g>';
 return d+o;
}
function buildSvg(st,part){
 if(CHAR==='bz')return buildBz(st);
 var sh=SHADES[st.s].c;
 var d='<defs><mask id="fm"><ellipse cx="'+EL.cx+'" cy="'+EL.cy+'" rx="'+(EL.rx-6)+'" ry="'+(EL.ry-6)+'" fill="#fff"/></mask>'
 +'<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter></defs>';
 var o='';if(part!=='beard'){o=rough('<ellipse cx="'+EL.cx+'" cy="'+EL.cy+'" rx="'+EL.rx+'" ry="'+EL.ry+'" fill="none" stroke="'+INK+'" stroke-width="12"/>');
 if(st.e===0)o+='<g mask="url(#fm)">'+img(P.eyewhite)+'</g>';
 o+=FORE[st.f].v(sh);
 o+=BROWS[st.b].photo?img(P.brows):BROWS[st.b].v();
 o+=EYES[st.e].photo?img(P.eyes):EYES[st.e].v();
 o+=NOSE[st.n].photo?img(P.nose):NOSE[st.n].v();
 }if(part!=='head')o+=BEARD[st.d].photo?img(P.beard):BEARD[st.d].v();
 return d+'<g transform="translate('+DX+' '+DY+')">'+o+'</g>';

var i=0,ans=[],ord=[],res=false,lock=false,cur='gy';
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.random()*(k+1)|0,t=a[k];a[k]=a[j];a[j]=t}return a}
function dots(){var h='';for(var k=0;k<7;k++)h+='<i'+((res||k<=i)?' class="on"':'')+'></i>';$('qd').innerHTML=h;$('qd').style.display=res?'none':'flex'}
function swap(fn){qb.classList.add('f');setTimeout(function(){fn();qb.classList.remove('f');qb.scrollTop=0},210)}
function showQ(){
 res=false;var q=Q[i];if(!ord[i])ord[i]=shuf(q.o);
 $('qt').textContent='测你是谁';$('qseal').textContent='第'+NUM[i]+'题';$('qback').style.visibility=i?'visible':'hidden';
 qb.innerHTML='<div class="qs">'+q.q+'</div><div class="qo">'+ord[i].map(function(o,k){return '<button class="qopt'+(ans[i]===o[1]?' sel':'')+'" data-k="'+k+'" type="button">'+o[0]+'</button>'}).join('')+'</div>';
 dots();
}
function result(){
 var sc={};ans.slice(0,7).forEach(function(a){sc[a]=(sc[a]||0)+1});
 var mx=Math.max.apply(null,Object.keys(sc).map(function(k){return sc[k]})),ties=Object.keys(sc).filter(function(k){return sc[k]===mx}),w=ties[0];

 setTimeout(function(){ans[i]=o[1];lock=false;if(i<6){i++;swap(showQ)}else swap(result)},280)});
