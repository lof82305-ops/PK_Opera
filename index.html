<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勾脸</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
:root{--bg:#f5eeea;--ink:#2a2420;--sub:#8a7f78;--line:#cdc3bc;--tab:#6b625c;--btn:#cfc7b3;--seal:#b8322a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1816;--ink:#efe9de;--sub:#a39b8f;--line:#3d3732;--tab:#b9aea2;--btn:#4a443b;--seal:#c0463d}}
:root[data-theme="dark"]{--bg:#1b1816;--ink:#efe9de;--sub:#a39b8f;--line:#3d3732;--tab:#b9aea2;--btn:#4a443b;--seal:#c0463d}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
.back{position:absolute;left:14px;top:12px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(160,152,146,.85);color:#fff;display:grid;place-items:center}
.tcol{position:absolute;left:24px;top:84px;display:flex;flex-direction:column;align-items:center;gap:14px}
.title{writing-mode:vertical-rl;font-weight:900;font-size:38px;line-height:1.15;letter-spacing:.08em}
.seal{writing-mode:vertical-rl;background:var(--seal);color:var(--bg);font-size:12px;line-height:1.1;padding:5px 4px;border-radius:2px;letter-spacing:.05em}
.toast{position:absolute;left:50%;top:25%;transform:translateX(-50%);padding:11px 22px;border-radius:99px;background:var(--tab);color:var(--bg);font-size:13px;letter-spacing:.16em;white-space:nowrap;transition:opacity .4s;pointer-events:none;z-index:3}
.tools{position:absolute;right:16px;top:84px;display:flex;flex-direction:column;gap:16px;align-items:center}
.tool{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tool .ring{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--sub)}
.tool em{font-style:normal;font-size:12px;letter-spacing:.2em;color:var(--sub);white-space:nowrap}
.stage{position:absolute;left:50%;top:31%;transform:translateX(-50%);width:min(84%,calc(44dvh * .894));aspect-ratio:706/790;filter:drop-shadow(0 10px 14px rgba(120,90,80,.2));isolation:isolate}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage canvas{touch-action:none}
.stage svg{pointer-events:none}
.tabs{position:absolute;left:12px;right:12px;bottom:114px;display:flex;justify-content:center;gap:8px}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--sub);font-size:13px;letter-spacing:.12em}
.pill[aria-pressed="true"]{background:var(--tab);border-color:var(--tab);color:var(--bg)}
.bottom{position:absolute;left:0;right:0;bottom:20px;height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px}
.dots{display:flex;gap:14px;align-items:center}
.dot{width:46px;height:46px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.dot.opt{width:58px;height:58px;background:rgba(150,138,128,.16);font-size:12px;letter-spacing:.04em;color:var(--ink)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--sub)}
.next{width:52px;height:52px;border-radius:50%;border:0;background:var(--btn);color:#fff;display:grid;place-items:center}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

@keyframes cbreathe{50%{opacity:.5}}

.act.on{display:flex}.act.vis{opacity:1}

.card{margin:0 20px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;font-size:12.5px;line-height:1.7;color:var(--sub);background:rgba(255,255,255,.35)}
.card h3{margin:0 0 4px;font-size:15px;color:var(--ink);letter-spacing:.2em}.card h3 small{font-size:12px;font-weight:400;letter-spacing:.1em;margin-left:10px;color:var(--sub)}.card p{margin:0}

 }if(part!=='head')o+=BEARD[st.d].photo?img(P.beard):BEARD[st.d].v();

}

var raf=0,SH={x:128,y:338},L1=78,L2=98,HA=[192,268],HB=[232,322],HC=[150,356];
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}

 else if(c<.8){var v=(c-.55)/.25,w=1-v;hx=w*w*HB[0]+2*w*v*HC[0]+v*v*HA[0];hy=w*w*HB[1]+2*w*v*HC[1]+v*v*HA[1];pull=1-ease(v)}
 else{hx=HA[0];hy=HA[1];pull=0}
 var e=ik(hx,hy),d='M'+SH.x+' '+SH.y+'L'+e[0]+' '+e[1]+'L'+hx+' '+hy;
 function seg(p,q){return 'M'+(e[0]+(hx-e[0])*p)+' '+(e[1]+(hy-e[1])*p)+'L'+(e[0]+(hx-e[0])*q)+' '+(e[1]+(hy-e[1])*q)}
 ['a1','a2'].forEach(function(i){$(i).setAttribute('d',d)});
 $('a4').setAttribute('d',seg(.5,.6));$('a3o').setAttribute('d',seg(.65,.94));$('a3').setAttribute('d',seg(.66,.93));
 var h=$('hand');h.setAttribute('cx',hx);h.setAttribute('cy',hy);
 $('bd').setAttribute('transform','translate(205 262) rotate('+(pull*1.8)+') scale(1 '+(1+.03*pull)+') translate(-205 -262)');
 $('hd').setAttribute('transform','translate(0 '+(Math.sin(t*2)*.8+pull*1.2)+')');
}
